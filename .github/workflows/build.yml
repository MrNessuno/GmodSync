name: Build eseguibili

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compila
        run: cargo build --release

      - name: Pacchetto Linux
        if: matrix.name == 'linux'
        run: |
          mkdir dist
          cp target/release/gmod-ws-sync dist/
          cp target/release/build/steamworks-sys-*/out/libsteam_api.so dist/
          printf '#!/bin/sh\ncd "$(dirname "$0")"\nLD_LIBRARY_PATH=. exec ./gmod-ws-sync\n' > dist/avvia.sh
          chmod +x dist/avvia.sh dist/gmod-ws-sync
          tar -czf gmod-ws-sync-linux.tar.gz -C dist .

      - name: Pacchetto Windows
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target\release\gmod-ws-sync.exe dist\
          Copy-Item target\release\build\steamworks-sys-*\out\steam_api64.dll dist\
          Compress-Archive -Path dist\* -DestinationPath gmod-ws-sync-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: gmod-ws-sync-${{ matrix.name }}
          path: |
            gmod-ws-sync-linux.tar.gz
            gmod-ws-sync-windows.zip
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > note.md <<'NOTE'
          Programma per tenere allineate le iscrizioni al Workshop di Garry's Mod tra amici.

          **Windows:** scarica `gmod-ws-sync-windows.zip`, estrai tutto in una cartella e avvia `gmod-ws-sync.exe`.
          **Linux:** scarica `gmod-ws-sync-linux.tar.gz`, estrai e avvia `avvia.sh`.

          Serve Steam aperto con l'account che possiede Garry's Mod. Al primo avvio scegli dove tenere la lista del gruppo: collezione Steam, cartella condivisa o repository GitHub.
          NOTE
          gh release create "$GITHUB_REF_NAME" pacchetti/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Garry's Mod Workshop Sync $GITHUB_REF_NAME" \
            --notes-file note.md
