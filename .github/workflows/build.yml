name: Build eseguibili

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      versione:
        description: "Se compilato (es. v0.1.0) crea una release con questo nome"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Librerie di sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Compila
        run: cargo build --release

      # Il programma vero e la libreria di Steam vengono messi dentro un
      # avviatore, così si distribuisce un solo file.
      - name: File singolo (Linux)
        if: matrix.name == 'linux'
        run: |
          export GMOD_EXE="$PWD/target/release/gmod-ws-sync"
          export GMOD_LIB="$(ls "$PWD"/target/release/build/steamworks-sys-*/out/libsteam_api.so | head -n1)"
          cargo build --release --manifest-path launcher/Cargo.toml
          cp launcher/target/release/gmod-ws-sync-launcher gmod-ws-sync-linux
          chmod +x gmod-ws-sync-linux

      - name: File singolo (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $env:GMOD_EXE = (Resolve-Path target\release\gmod-ws-sync.exe).Path
          $env:GMOD_LIB = (Get-ChildItem target\release\build\steamworks-sys-*\out\steam_api64.dll | Select-Object -First 1).FullName
          cargo build --release --manifest-path launcher/Cargo.toml
          Copy-Item launcher\target\release\gmod-ws-sync-launcher.exe gmod-ws-sync-windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: gmod-ws-sync-${{ matrix.name }}
          path: |
            gmod-ws-sync-linux
            gmod-ws-sync-windows.exe
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.versione != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: pacchetti
          merge-multiple: true
      - name: Crea la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSIONE: ${{ inputs.versione || github.ref_name }}
        run: |
          cat > note.md <<'NOTE'
          Programma per tenere allineate le iscrizioni al Workshop di Garry's Mod tra amici.

          **Windows:** scarica `gmod-ws-sync-windows.exe` e avvialo.
          **Linux:** scarica `gmod-ws-sync-linux`, rendilo eseguibile (tasto destro → Proprietà → Permessi, oppure `chmod +x gmod-ws-sync-linux`) e avvialo.

          È un file singolo: al primo avvio prepara da solo quello che gli serve in una cartella dell'utente.
          Serve Steam aperto con l'account che possiede Garry's Mod. Al primo avvio scegli dove tenere la lista del gruppo: collezione Steam, cartella condivisa o repository GitHub.
          NOTE
          gh release create "$VERSIONE" pacchetti/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Garry's Mod Workshop Sync $VERSIONE" \
            --notes-file note.md
