[package]
name = "gmod-ws-sync"
version = "0.1.0"
edition = "2021"

[dependencies]
steamworks = "0.13"
eframe = "0.31"
egui_extras = { version = "0.31", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
dirs = "5"
